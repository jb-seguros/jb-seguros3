docver:async id=>{const d=DB.docs.find(x=>x.id==id);$('#m').innerHTML=`<div class="box wide"><div class="row"><h3 class="sp">📄 ${esc(d?d.name:'Documento')}</h3><button data-a="x">✕</button></div><div class="pvh" id="pvh"><div class="empty">⏳ Descargando…</div></div></div>`;$('#m').classList.add('on');try{await pdfView($('#pvh'),await leerDoc(id))}catch(e){$('#pvh').innerHTML=`<div class="empty">${esc(msgErr(e))}</div>`}},
docdel:async id=>{if(!confirm('¿Eliminar este documento? No se puede deshacer.'))return;try{await aiReq('/api/docs/delete',{id});DB.docs=DB.docs.filter(x=>x.id!=id);save();if(S.pc)profile(S.pc)}catch(e){toast(msgErr(e))}},
mdr:async()=>{const m=$('#mm');m.textContent='⏳ Redactando con OpenAI…';try{const p=DB.p.filter(x=>x.cid==S.mcid&&!x.canc).sort((a,b)=>a.fin.localeCompare(b.fin))[0],j=await aiReq('/api/email/draft',{clienteId:S.mcid,instruccion:p?`recordatorio de renovación de la póliza de ${p.tipo} que vence el ${p.fin}`:'seguimiento cordial',data:snap2()});$('#ms').value=j.asunto;$('#mb').value=j.cuerpo;m.textContent='Borrador listo: revísalo antes de enviar.'}catch(e){m.textContent='❌ '+msgErr(e)}},
msend:async()=>{const c=cl(S.mcid),s=$('#ms').value.trim(),b=$('#mb').value.trim(),m=$('#mm');if(!s||!b)return m.textContent='Escribe asunto y mensaje.';if(!confirm('¿Enviar este correo a '+c.email+'?'))return;m.textContent='⏳ Enviando…';
try{const j=await aiReq('/api/email/send',{to:c.email,asunto:s,cuerpo:b,cid:S.mcid,autorizo:'Javier Barbosa'});log(S.mcid,'✉️','Correo aceptado por el proveedor: '+s.slice(0,60));save();close();R();toast('El proveedor aceptó el correo (la entrega se confirma en Configuración › Historial)')}catch(e){m.textContent='❌ '+msgErr(e)}}});
FCC.splice(FCC.length-1,0,{k:'consentPromos',l:'Acepta recibir promociones por correo',o:['No','Sí']});FCP.splice(FCP.length-1,0,{k:'consentPromos',l:'Acepta recibir promociones por correo',o:['No','Sí']});

boot();
</script></body></html>
